<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de inventario de productos de una jugueteria">
    <title>Inicio de sesión</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="mainLogin">
        <section aria-labelledby="tituloLogin" class="tarjetaLogin">
            <div class="encabezadoLogin">
                <img src="../img/logo.png" alt="Logo de la juguetería"
                class="logoJugueteria">

                <h1 id="tituloLogin">Iniciar Sesión</h1>
                <p>Debes iniciar sesión para visualizar el inventario.</p>
            </div>

            <form id="formularioLogin" class="formularioLogin" novalidate>
                <div class="campo">
                    <label for="inputUsuario">Usuario</label>
                    <input
                        type="text"
                        id="inputUsuario"
                        name="usuario"
                        maxlength="100"
                        placeholder="Ej. Valeria"
                        autocomplete="username"
                        aria-describedby="mensajeLogin"
                        required
                    >
                </div>
                <div class="campo">
                    <label for="inputContrasena">Contraseña</label>
                    <div class="contenedorContrasena">
                        <input
                            type="password"
                            id="inputContrasena"
                            name="contrasena"
                            maxlength="100"
                            placeholder="Ej. 1234"
                            autocomplete="current-password"
                            aria-describedby="mensajeLogin"
                            required
                        >
                        <button
                            type="button"
                            id="botonMostrarContrasena"
                            class="botonMostrarContrasena"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false"
                            title="Mostrar contraseña">
                            <svg
                                id="iconoContrasenaAbierta"
                                class="iconoContrasena iconoContrasenaOculto"
                                aria-hidden="true"
                                viewBox="0 0 24 24"
                                focusable="false">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg
                                id="iconoContrasenaCerrada"
                                class="iconoContrasena"
                                aria-hidden="true"
                                viewBox="0 0 24 24"
                                focusable="false">
                                <path d="m3 3 18 18"></path>
                                <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c7 0 10 7 10 7a17.2 17.2 0 0 1-3.1 4.4"></path>
                                <path d="M6.7 6.7C3.7 8.7 2 12 2 12s3 7 10 7a10.7 10.7 0 0 0 4.2-.8"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="opcionesLogin">
                    <label>
                        <input
                            type="checkbox"
                            id="recordarUsuario"
                            name="recordarUsuario">
                        Recordar usuario
                    </label>
                </div>
                <div class="campo">
                    <button type="submit" class="botonIniciarSesion" id="botonIniciarSesion">Iniciar Sesión</button>
                </div>
            </form>
            <div id="mensajeLogin" class="mensajeLogin" role="alert" aria-live="polite">
            </div>

        </section>
    </main>

    <script src="../js/sesion.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
